name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build game (static, offline)
        run: |
          npx vite build --config vite.mobile.config.ts
          mv dist-mobile/mobile/index.html dist-mobile/index.html
          sed -i 's#\.\./assets/#./assets/#g' dist-mobile/index.html
          ls -R dist-mobile | head -30

      - name: Create Android project and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: longshot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
